[package]
name = "ssh-tunnel-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
anyhow = "1.0.104"
auto-launch = "0.6.0"
chrono = { version = "0.4.45", features = ["serde"] }
crossbeam-channel = "0.5.17"
ctrlc = { version = "3.5.2", features = ["termination"] }
directories = "6.0.0"
eframe = "0.37.0"
egui_extras = "0.37.0"
glob = "0.3.4"
image = { version = "0.25.6", default-features = false, features = ["png"] }
listeners = "0.6.1"
notify-rust = "4.17.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
tray-icon = "0.24.2"
uuid = { version = "1.28.0", features = ["v4", "serde", "v5"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
libc = "0.2.190"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

[package.metadata.packager]
product-name = "SSH Tunnel Manager"
identifier = "dev.kratos.ssh-tunnel-manager"
out-dir = "dist"
before-packaging-command = "cargo build --release"
icons = ["assets/icon_32.png", "assets/icon_128.png", "assets/icon_256.png", "assets/icon_512.png", "assets/icon.icns", "assets/icon.ico"]
